# ADE20K Scene Synthesis Config
# python train.py --config configs/ade20k.yaml
# Download: http://data.csail.mit.edu/places/ADEchallenge/ADEChallengeData2016.zip

model:
  image_size: 256
  in_channels: 3
  base_channels: 64
  channel_mults: [1, 2, 4, 8, 8]
  clip_dim: 512
  attn_levels: [2, 3]
  z_dim: 256
  use_noise: true
  disc_base_channels: 64
  disc_num_layers: 4
  disc_num_scales: 3

clip:
  model_name: ViT-B-32

data:
  dataset: ade20k
  root: ./data/ADEChallengeData2016
  num_classes: 150
  num_workers: 4
  augment: true

training:
  epochs: 150
  batch_size: 4
  lr_g: 1.0e-4
  lr_d: 4.0e-4
  n_disc_steps: 1
  grad_clip: 1.0
  ema_decay: 0.999
  warmup_epochs: 5
  gan_loss_mode: hinge
  lambda_feat: 10.0
  lambda_vgg: 10.0
  seed: 42
  output_dir: outputs/ade20k

logging:
  use_wandb: false
  use_tensorboard: true
  log_every: 50
  sample_every: 500
  save_every_epochs: 10
